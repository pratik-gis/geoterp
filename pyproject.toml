[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoterp"
version = "0.1.0"
description = "Spatial interpolation for vector (points & polygons) and raster data — one consistent API and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pratik Mahadik" }]
keywords = [
    "gis", "geospatial", "interpolation", "kriging", "idw",
    "geostatistics", "raster", "resampling", "dasymetric", "pycnophylactic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "shapely>=2.0",
    "geopandas>=0.13",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "pykrige>=1.7",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
xarray = ["xarray>=2023.1"]
dev = ["pytest>=7.0", "matplotlib>=3.6"]

[project.scripts]
geoterp = "geoterp.cli:main"

[project.urls]
Homepage = "https://github.com/pratik-gis/geoterp"
Blog = "https://pratik-mahadik.github.io/blog/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
